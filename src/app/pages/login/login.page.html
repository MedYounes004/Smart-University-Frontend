<ion-content class="login-content">
  <!-- Back Button -->
  <button class="back-btn" (click)="goBack()">
    <ion-icon name="arrow-back-outline"></ion-icon>
  </button>

  <!-- ── METHOD SELECTION ── -->
  <div class="screen fade-in" *ngIf="!loginMethod()">
    <div class="screen-body">
      <h2 class="title">Welcome Back</h2>
      <p class="subtitle">Choose your preferred login method</p>

      <div class="method-list">
        <button class="method-card" (click)="loginMethod.set('email')">
          <div class="method-icon"><ion-icon name="mail-outline"></ion-icon></div>
          <div class="method-info">
            <h3>University Email</h3>
            <p>Login with OTP verification</p>
          </div>
        </button>

        <button class="method-card" (click)="loginMethod.set('student-id')">
          <div class="method-icon"><ion-icon name="card-outline"></ion-icon></div>
          <div class="method-info">
            <h3>Student ID Card</h3>
            <p>Scan via NFC or QR code</p>
          </div>
        </button>

        <button class="method-card" (click)="loginMethod.set('biometric')">
          <div class="method-icon"><ion-icon name="finger-print-outline"></ion-icon></div>
          <div class="method-info">
            <h3>Biometric</h3>
            <p>Fingerprint or Face ID</p>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- ── EMAIL: Step 1 – Enter Email ── -->
  <div class="screen fade-in" *ngIf="loginMethod() === 'email' && !otpSent">
    <div class="screen-body">
      <h2 class="title">Login with Email</h2>
      <p class="subtitle">Enter your university email address</p>
      <div class="form-group">
        <input
          class="text-input"
          type="email"
          placeholder="student@university.edu"
          [(ngModel)]="email"
        />
        <button class="primary-btn" [disabled]="!email" (click)="sendOtp()">
          Send OTP Code
        </button>
      </div>
    </div>
  </div>

  <!-- ── EMAIL: Step 2 – OTP ── -->
  <div class="screen fade-in" *ngIf="loginMethod() === 'email' && otpSent">
    <div class="screen-body">
      <h2 class="title">Enter OTP Code</h2>
      <p class="subtitle">We sent a 6-digit code to {{ email }}</p>
      <div class="otp-row">
        <input
          *ngFor="let d of otpDigits; let i = index"
          class="otp-input"
          type="tel"
          inputmode="numeric"
          maxlength="1"
          [value]="otpDigits[i]"
          (input)="onOtpInput(i, $event)"
          (keydown)="onOtpKeydown(i, $event)"
        />
      </div>
      <button class="primary-btn" [disabled]="!otpComplete" (click)="verifyOtp()">
        Verify &amp; Login
      </button>
      <button class="ghost-btn">Resend Code</button>
    </div>
  </div>

  <!-- ── STUDENT ID ── -->
  <div class="screen center fade-in" *ngIf="loginMethod() === 'student-id'">
    <div class="screen-body center">
      <div class="scan-box" [class.pulsing]="loading">
        <ion-icon name="card-outline"></ion-icon>
      </div>
      <h2 class="title">Scan Student ID</h2>
      <p class="subtitle">Place your student ID card near the device</p>
      <button class="outline-btn" (click)="simulateScan()" [disabled]="loading">
        {{ loading ? 'Scanning…' : 'Simulate Scan' }}
      </button>
    </div>
  </div>

  <!-- ── BIOMETRIC ── -->
  <div class="screen center fade-in" *ngIf="loginMethod() === 'biometric'">
    <div class="screen-body center">
      <div class="bio-circle" [class.pulsing]="loading">
        <ion-icon name="finger-print-outline"></ion-icon>
      </div>
      <h2 class="title">Biometric Login</h2>
      <p class="subtitle">Use your fingerprint or face ID to login</p>
      <button class="primary-btn" (click)="simulateBiometric()" [disabled]="loading">
        {{ loading ? 'Authenticating…' : 'Authenticate' }}
      </button>
    </div>
  </div>

</ion-content>
